# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

language: ko-KR
tone_instructions: '간결하고 직접적으로. 지적할 때는 이유를 한 문장으로 설명하고, 필요하면 수정 예시 코드를 보여줘.'

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - '!**/pnpm-lock.yaml'
    - '!dist/**'
    - '!public/mockServiceWorker.js'

  path_instructions:
    - path: '**'
      instructions: |
        - ESLint/Prettier가 이미 잡는 이슈(파일/폴더 네이밍, I 접두어, enum 사용,
          console, non-null assertion, axios 직접 import, new Date)는 지적하지 않는다.
        - 로직 버그, 예외 처리 누락, 접근성, 불필요한 리렌더링, 타입 안전성 위주로 본다.
        - 사소한 취향 차이는 코멘트하지 않는다.
        - 아래 컨벤션 중 린트로 못 잡는 항목(함수명, boolean, ID, 핸들러, Props 타입 등)을 확인한다.
          * 함수는 동사로 시작 (findProgramsByRegion)
          * 이벤트 핸들러는 handle{이름}, props 콜백은 on{이름}
          * boolean 내부 상태는 is/has/can 접두어 허용, API 응답 필드는 BE 이름 그대로
          * ID 필드는 BE와 동일하게 {리소스 전체 이름}Id (supportProgramId), 줄이지 않음
          * 타입 기본은 type, Props 타입은 {컴포넌트}Props
          * 에러 코드/enum 값은 BE 문자열과 동일하게 as const 객체 + union 타입
  path_instructions:
    - path: 'src/api/**'
      instructions: |
        - axios 인스턴스는 client.ts, 도메인별 API 함수는 program.ts 같은 camelCase 파일에 둔다.
        - 에러 처리와 응답 타입이 명확한지 확인한다.
        - 요청/응답 타입이 BE DTO 이름과 대응하는지 확인한다
          (CreateScheduleRequest, ProgramDetailResponse).
    - path: 'src/components/**'
      instructions: |
        - 파일명 = 컴포넌트명이고, Props 타입은 {컴포넌트}Props인지 확인한다.
        - 공통(common), 화면 틀(layout), 도메인 전용(program/schedule/guide) 위치가 맞는지 본다.
        - 컴포넌트가 데이터 fetching을 직접 하지 않고 hooks/api를 쓰는지 본다.
        - props 타입, 접근성(aria, 키보드 조작), 불필요한 상태/effect를 확인한다.
    - path: 'src/pages/**'
      instructions: |
        - 라우트 단위 화면이고 파일명이 {이름}Page인지 확인한다.
        - 비즈니스 로직은 hooks로, 표현은 components로 분리되어 있는지 본다.
    - path: 'src/hooks/**'
      instructions: |
        - use 접두어 camelCase인지 확인한다.
        - effect 의존성 배열, 클린업, 경쟁 상태(race condition)를 확인한다.
        - 서버 데이터 조회 훅은 로딩/에러 상태를 호출부에 충분히 전달하는지 본다.
    - path: 'src/store/**'
      instructions: |
        - 파일은 {이름}Store.ts, 훅은 use{이름}Store 형태인지 확인한다 (authStore.ts / useAuthStore).
        - 서버 상태를 store에 중복 저장하지 않았는지 본다.
    - path: 'src/types/**'
      instructions: |
        - API 요청/응답 타입이 BE DTO와 대응하는지 확인한다.
        - ID 필드는 {리소스 전체 이름}Id로 줄이지 않았는지 확인한다.
    - path: 'src/constants/**'
      instructions: |
        - 상수는 UPPER_SNAKE_CASE인지 확인한다 (MAX_PAGE_SIZE).
        - 에러 코드/enum 값은 BE 문자열과 동일한 as const 객체 + union 타입인지 확인한다.
    - path: 'src/utils/**'
      instructions: |
        - 순수 함수인지(부수 효과 없음) 확인한다.
        - 날짜 처리는 날짜 유틸을 거치는지 확인한다.
    - path: 'src/mock/**'
      instructions: |
        - MSW 핸들러와 목 데이터는 BE 연동 후 제거 대상이므로, 실제 코드에서 의존하지 않는지만 확인한다.
    - path: 'src/styles/**'
      instructions: |
        - CSS 테마 변수는 --{종류}-{이름}-{단계} 형식인지 확인한다 (--color-primary-500).
    - path: 'src/assets/**'
      instructions: |
        - 에셋 파일명이 kebab-case + 종류 접두어인지 확인한다 (icon-bell.svg, img-empty-schedule.png).
    - path: '.env*'
      instructions: |
        - 클라이언트에 노출되는 환경변수는 VITE_ + UPPER_SNAKE_CASE인지 확인한다.
        - 실제 비밀 값이 커밋되지 않았는지 확인한다.
    - path: '**/*.test.*'
      instructions: |
        - 구현 세부사항이 아니라 동작을 검증하는지 확인한다.

chat:
  auto_reply: true
